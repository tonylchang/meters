# XcodeGen source of truth. The generated meters.xcodeproj is not committed;
# run `make generate` or any `make` target that builds.
name: meters
options:
  bundleIdPrefix: net.1x0
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Apple Silicon only.
    ARCHS: arm64
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Local builds only: sign to run locally, no team or hardened runtime yet.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  MetersKit:
    path: Packages/MetersKit
targets:
  meters:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: MetersKit
        product: MetersCore
      - package: MetersKit
        product: MetersUI
    settings:
      base:
        PRODUCT_NAME: meters
        PRODUCT_BUNDLE_IDENTIFIER: net.1x0.meters
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: meters
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        # Agent app: no Dock icon or app switcher entry. Also required for the HUD to appear over
        # other apps' fullscreen Spaces.
        INFOPLIST_KEY_LSUIElement: YES
      configs:
        # Release is what the automated checks audit; keep it free of the debugger entitlement.
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    scheme: {}
